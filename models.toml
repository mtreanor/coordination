# Model profiles. A Run assigns each agent a profile by name.
#
# Keys: provider, model (required); base_url, temperature, max_tokens, seed,
# thinking (false | true | "minimal" | "low" | "medium" | "high" | "xhigh"),
# output_mode ("native" | "tool" | "prompted"). Unknown keys are rejected.
#
# API keys never go here: put them in .env (gitignored), e.g. ANTHROPIC_API_KEY.

# ── Local, through Ollama (http://localhost:11434) ─────────────────────────────

[profiles.qwen-9b]
provider = "ollama"
model = "qwen3.5:9b"
temperature = 0.7

[profiles.gemma-12b]
provider = "ollama"
model = "gemma4:12b"
temperature = 0.7

[profiles.granite-8b]
provider = "ollama"
model = "granite4.1:8b"
temperature = 0.7

# ── Hosted APIs ────────────────────────────────────────────────────────────────

[profiles.claude-sonnet]
provider = "anthropic"
model = "claude-sonnet-5"

[profiles.claude-haiku]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"

[profiles."claude-haiku-5-5"]
# The Claude model for the preregistered comparison (docs/experiments/prereg-confirmatory.md):
# the same cheap, fast class as gemini-3.6-flash. Thinking off, like the Gemini profiles.
# Named for its model id, so a Run's config.json and decision log say which model played.
provider = "anthropic"
model = "claude-haiku-5-5"
output_mode = "tool"

[profiles.gemini-flash]
provider = "google"
model = "gemini-3.8-flash"

[profiles."gemini-3.6-flash"]
# The model for Runs from Nov 8 2026, ~16:00, on. gemini-3.8-flash (profile gemini-flash)
# reached Tier 1's 10,000 requests per model per day, and Google serves gemini-3.7-flash
# requests on 3.8's allowance (its 429 names gemini-3.8-flash), so 3.6 is the nearest Flash
# with its own. Checked that responses report modelVersion gemini-3.6-flash
# (gemini-3.5-flash is served by 3.6). Named for its model id, so a Run's config.json and
# decision log say which model played.
provider = "google"
model = "gemini-3.6-flash"

[profiles.gemini-flash-lite]
provider = "google"
model = "gemini-3.5-flash-lite"

# For OpenAI, use provider = "openai" with OpenAI's current model id, and set
# OPENAI_API_KEY in .env.
