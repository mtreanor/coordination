description = "Confirmatory test of pilot observations, H1 (docs/experiments/prereg-confirmatory.md, registered alone: Not My Bug stays exploratory): in the Investment Club with a hidden skimmer (bob), does the social layer raise investment and team coins? The pilot was exp/2-club-skimmer (gemini-flash, seeds 0-2). Fresh seeds 100-114. The first condition is the baseline for paired differences."
config = "configs/investment-club-rue-smoke.toml"
runs = 15
first_seed = 100
rounds = 10
chooser = "gemini-3.6-flash"
parallel = 6

[conditions.work-only-matched]
social = "off-matched"
situations = ["hidden-skimmer"]

[conditions.social]
situations = ["hidden-skimmer"]

[conditions.work-only]
social = "off"
situations = ["hidden-skimmer"]
