description = "Not My Bug with the RUE social world: the office history or a neutral start, each with and without bob as a defector (special instructions to put himself first)."
config = "configs/not-my-bug-rue-smoke.toml"
runs = 1            # a batch of 1 while the social world is being refined; raise for trials
rounds = 10
chooser = "gemini-3.6-flash"
parallel = 4

# The first condition is the baseline for paired differences.
[conditions.history]
situations = ["office-history"]

[conditions.neutral]
situations = []

[conditions.history-defector]
situations = ["office-history", "bob-defects"]

[conditions.neutral-defector]
situations = ["bob-defects"]
